# 墨码 (MoMa) — CI 工作流
#
# 代码提交和 PR 时自动运行：
# - 编译项目
# - 运行测试（含 DI 容器、缓存、并发等 44+ 测试用例）
# - 打包 fat JAR

name: 墨码 CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21]

    name: Java ${{ matrix.java }} 构建与测试

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: 编译项目
        run: mvn compile -B

      - name: 运行测试
        run: mvn test -B

      - name: 打包 fat JAR
        run: mvn package -DskipTests -B

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: moma-java${{ matrix.java }}.jar
          path: target/moma.jar
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    name: 代码检查

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven

      - name: 编译检查（显示所有警告）
        run: mvn compile -B -Xdiags:verbose
